services:
  shortener:
    container_name: url-shortener
    build: .
    env_file:
      - .env
    volumes:
      - ./urlshortener.db:/app/urlshortener.db
    ports:
      - "3000:3000"

# --- Reverse Proxy (select one) ---
#
# Option A — Traefik:
# Replace with your domain and network. The `proxy` network must be
# declared in an external compose file or created via `docker network create`.
#
#   networks:
#     - proxy
#   labels:
#     - traefik.enable=true
#     - traefik.http.routers.url-shortener.rule=Host(`your-domain.com`)
#     - traefik.http.services.url-shortener.loadbalancer.server.port=3000

# Option B — Caddy:
#   Add to your Caddyfile: reverse_proxy url-shortener:3000
#
# Option C — Nginx:
#   proxy_pass http://localhost:3000;

# networks:
#   proxy:
#     external: true
