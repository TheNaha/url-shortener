
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrics - URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin"><i class="fas fa-link"></i> URL Shortener</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card shadow-lg">
            <div class="card-header">
                <h3><i class="fas fa-chart-line"></i> Metrics for <span id="short-id"></span></h3>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <canvas id="visits-over-time-chart"></canvas>
                    </div>
                    <div class="col-md-6">
                        <canvas id="userAgentChart"></canvas>
                    </div>
                </div>
                <div class="row mt-4">
                    <div class="col-md-12">
                        <canvas id="osChart"></canvas>
                    </div>
                </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const shortId = window.location.pathname.split('/').pop();
            const response = await fetch(`/api/v1/urls/metrics/${shortId}`);
            const data = await response.json();
            const userAgents = data.visits.map(visit => visit.user_agent);

            // Visits over time chart
            const visitsOverTimeCtx = document.getElementById('visits-over-time-chart').getContext('2d');
            new Chart(visitsOverTimeCtx, {
                type: 'line',
                data: {
                    labels: data.visits.map(visit => new Date(visit.visited_at).toLocaleString()),
                    datasets: [{
                        label: 'Visits Over Time',
                        data: data.visits.map((_, index) => index + 1),
                        borderColor: '#6a0dad',
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Visits Over Time'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

            // Function to parse user agent for browser and OS
            function parseUserAgent(ua) {
                let browser = 'Other';
                let os = 'Other';

                // Detect Browser
                if (ua.includes('Edge')) {
                    browser = 'Edge';
                } else if (ua.includes('Chrome') && !ua.includes('Chromium')) {
                    browser = 'Chrome';
                } else if (ua.includes('Firefox')) {
                    browser = 'Firefox';
                } else if (ua.includes('Safari') && !ua.includes('Chrome') && !ua.includes('Edge')) {
                    browser = 'Safari';
                } else if (ua.includes('Opera') || ua.includes('OPR')) {
                    browser = 'Opera';
                } else if (ua.includes('Mozilla')) { // Fallback for other Mozilla-based browsers
                    browser = 'Mozilla';
                }

                // Detect OS
                if (ua.includes('Windows')) {
                    os = 'Windows';
                } else if (ua.includes('Android')) {
                    os = 'Android';
                } else if (ua.includes('Macintosh') || ua.includes('Mac OS')) {
                    os = 'macOS';
                } else if (ua.includes('Linux')) { // General Linux, excluding Android
                    os = 'Linux';
                }

                return { browser, os };
            }

            const browserCounts = {
                'Chrome': 0,
                'Firefox': 0,
                'Safari': 0,
                'Edge': 0,
                'Opera': 0,
                'Mozilla': 0,
                'Other': 0
            };

            const osCounts = {
                'Windows': 0,
                'Linux': 0,
                'macOS': 0,
                'Android': 0,
                'Other': 0
            };

            userAgents.forEach(ua => {
                const { browser, os } = parseUserAgent(ua);
                if (browserCounts.hasOwnProperty(browser)) {
                    browserCounts[browser]++;
                } else {
                    browserCounts['Other']++;
                }

                if (osCounts.hasOwnProperty(os)) {
                    osCounts[os]++;
                } else {
                    osCounts['Other']++;
                }
            });

            // Browser Chart
            const browserLabels = Object.keys(browserCounts);
            const browserData = Object.values(browserCounts);

            const browserCtx = document.getElementById('userAgentChart').getContext('2d');
            new Chart(browserCtx, {
                type: 'bar',
                data: {
                    labels: browserLabels,
                    datasets: [{
                        label: 'Browser Distribution',
                        data: browserData,
                        backgroundColor: 'rgba(75, 192, 192, 0.6)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Browser Distribution'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

            // OS Chart
            const osLabels = Object.keys(osCounts);
            const osData = Object.values(osCounts);

            const osCtx = document.getElementById('osChart').getContext('2d');
            new Chart(osCtx, {
                type: 'bar',
                data: {
                    labels: osLabels,
                    datasets: [{
                        label: 'Operating System Distribution',
                        data: osData,
                        backgroundColor: 'rgba(153, 102, 255, 0.6)',
                        borderColor: 'rgba(153, 102, 255, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Operating System Distribution'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        });
    </script>
    <footer class="footer mt-auto py-3">
        <div class="container text-center">
            <span class="text-muted">© 2025 TheNaha. All rights reserved.</span>
            <p class="text-muted">
                Made by <a href="https://thenaha.my.id" target="_blank">Naufal Hafizd Prayoga</a>
            </p>
        </div>
    </footer>
</body>
</html>
